  const firebaseConfig = {
    apiKey: "AIzaSyA6QDaIQXgz7ZLOITxH1J-2uIZWkXjzRck",
    authDomain: "jc-4th.firebaseapp.com",
    projectId: "jc-4th",
    storageBucket: "jc-4th.firebasestorage.app",
    messagingSenderId: "57537798594",
    appId: "1:57537798594:web:9649e837afbafff3eb765b",
  };

  window.__FB_READY_PROMISE = new Promise((resolve) => {
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.__FB = { db, doc, getDoc, setDoc, writeBatch, collection, query, where, getDocs, documentId };
      window.__FB_OK = true;
    } catch (e) {
      console.error("Firebase 초기화 실패:", e);

    }
    resolve();
  });
</script>

function answerParts(ans) {
  const list = (ans || "").split("|").map((x) => x.trim()).filter(Boolean);

  return { main: list[0] || "", alts: list.slice(1) };
}

/* ── 유틸 ── */
const normalize = (s) => (s || "").toLowerCase().replace(/[^0-9a-z가-힣ㄱ-ㅎㅏ-ㅣ]/g, "");

function checkAnswer(input, answer) {
  const inp = normalize(input);
  if (!inp || !answer) return false;
  return answer.split("|").some((v) => {
    if (v.includes(",")) return v.split(",").every((t) => inp.includes(normalize(t)));
    return inp === normalize(v);
  });
}

/* ── Firestore 기반 저장소 (window.storage와 동일한 호출 방식 유지) ──
   - 이미지처럼 큰 문자열 필드는 자동으로 별도 문서로 나눠 저장해서
     Firestore 문서 용량 제한(1MB)을 넘지 않도록 합니다. */
const SHARD_THRESHOLD = 150000; // 이 길이(문자 수)를 넘는 문자열 필드는 별도 문서로 분리 저장

async function sGet(key) {
  await window.__FB_READY_PROMISE;
  if (!window.__FB_OK || !window.__FB) return null;
  const { db, doc, getDoc } = window.__FB;
  try {
    const snap = await getDoc(doc(db, "kv", key));
    if (!snap.exists()) return null;
    const raw = snap.data();
    if (!raw || typeof raw.json !== "string") return null;
    const val = JSON.parse(raw.json);
    if (val && typeof val === "object" && !Array.isArray(val)) {
      const fields = Object.keys(val);
      await Promise.all(
        fields.map(async (f) => {
          if (typeof val[f] === "string" && val[f].startsWith("__shard__")) {
            const shardKey = val[f].slice("__shard__".length);
            const shardSnap = await getDoc(doc(db, "kv", shardKey));
            val[f] = shardSnap.exists() ? shardSnap.data().v || "" : "";
          }
        })
      );
    }
    return val;
  } catch (e) {
    console.error("sGet 오류:", e);
    return null;
  }
}

async function sSet(key, val) {
  await window.__FB_READY_PROMISE;
  if (!window.__FB_OK || !window.__FB) return false;
  const { db, doc, setDoc, writeBatch } = window.__FB;
  try {
    let toStore = val;
    const shardWrites = [];
    if (val && typeof val === "object" && !Array.isArray(val)) {
      toStore = { ...val };
      for (const f of Object.keys(toStore)) {
        const v = toStore[f];
        if (typeof v === "string" && v.length > SHARD_THRESHOLD) {
          const shardKey = `${key}__${f}`;
          shardWrites.push({ shardKey, v });
          toStore[f] = `__shard__${shardKey}`;
        }
      }
    }
    if (shardWrites.length === 0) {
      await setDoc(doc(db, "kv", key), { json: JSON.stringify(toStore) });
    } else {
      const batch = writeBatch(db);
      batch.set(doc(db, "kv", key), { json: JSON.stringify(toStore) });
      for (const { shardKey, v } of shardWrites) {
        batch.set(doc(db, "kv", shardKey), { v });
      }
      await batch.commit();
    }
    return true;
  } catch (e) {
    console.error("sSet 오류:", e);
    return false;
  }
}

// 방문자 기록 전체 불러오기 (문서 이름이 "user-"로 시작하는 것)
async function listVisitors() {
  await window.__FB_READY_PROMISE;
  if (!window.__FB_OK || !window.__FB) return [];
  const { db, collection, query, where, getDocs, documentId } = window.__FB;
  const snap = await getDocs(query(collection(db, "kv"), where(documentId(), ">=", "user-"), where(documentId(), "<", "user.")));
  const out = [];
  snap.forEach((d) => {
    try { const v = JSON.parse(d.data().json); if (v && v.name) out.push({ id: d.id, ...v }); } catch {}
  });
  return out;
}

async function loadQuestion(course, n) {
  const stored = await sGet(`q-${course}-${n}`);
  const seed = SEED[`${course}:${n}`] || {};
  return { loc: "", guideText: "", posText: "", qText: "", answer: "", guideImg: "", posImg: "", qImg: "", bgImg: "", ...seed, ...(stored || {}) };
}

function compressImage(file, maxW = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        const ctx2 = c.getContext("2d");
        ctx2.fillStyle = "#fff";
        ctx2.fillRect(0, 0, c.width, c.height);
        ctx2.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ── 효과음 (Web Audio) ── */
let _audioCtx = null;
function getAudioCtx() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === "suspended") _audioCtx.resume();
    return _audioCtx;
  } catch {
    return null;
  }
}
function tone(ctx, freq, start, dur, type = "triangle", vol = 0.22) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, ctx.currentTime + start);
  g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  o.connect(g).connect(ctx.destination);
  o.start(ctx.currentTime + start);
  o.stop(ctx.currentTime + start + dur + 0.05);
}
function playFanfare() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  tone(ctx, 523.25, 0, 0.16, "triangle");
  tone(ctx, 659.25, 0.14, 0.16, "triangle");
  tone(ctx, 783.99, 0.28, 0.16, "triangle");
  tone(ctx, 1046.5, 0.42, 0.45, "triangle", 0.26);
  tone(ctx, 1318.5, 0.42, 0.45, "sine", 0.12);
}
function playBuzzer() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  tone(ctx, 180, 0, 0.18, "sawtooth", 0.16);
  tone(ctx, 140, 0.2, 0.28, "sawtooth", 0.16);
}

/* ── 방문자 로그인 ── */
function Login({ onBack, onDone }) {
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const submit = async () => {
    const n = name.trim();
    if (!n) return setMsg("이름을 입력해 주세요!");
    if (!/^\d{6}$/.test(pw)) return setMsg("비밀번호는 숫자 6자리예요!");
    const isTeacher = n === TEACHER_NAME;
    if (isTeacher && pw !== TEACHER_PW) return setMsg("선생님 비밀번호가 달라요!");
    setBusy(true);
    const key = `user-${normalize(n)}-${pw}`;
    let data = await sGet(key);
    let isNew = false;
    if (!data) {
      isNew = true;
      data = { name: n, pw, courses: {}, createdAt: new Date().toISOString() };
      await sSet(key, data);
    }
    setBusy(false);
    onDone({ key, isNew, ...data, teacher: isTeacher });
  };

  const inputStyle = { width: "100%", boxSizing: "border-box", marginTop: 6, padding: "13px 14px", fontSize: 18, borderRadius: 16, border: "3px solid #E3ECF7", background: "#F8FBFF" };
  return (
    <div style={{ paddingTop: 6 }}>
      <button onClick={onBack} className="press" style={{ background: "#fff", border: "none", borderRadius: 999, padding: "8px 16px", fontSize: 15, color: INK_SOFT, fontWeight: 700, boxShadow: "0 3px 0 rgba(36,64,107,.08)" }}>← 뒤로</button>

      <div style={{ display: "flex", alignItems: "flex-end", gap: 8, margin: "14px 0 18px" }}>
        <div style={{ flex: 1 }}>
          <h2 className="title-font" style={{ fontSize: 30, margin: "0 0 10px", color: INK }}>탐험대원 등록 📇</h2>
          <Bubble tail="right" style={{ fontSize: 14.5, color: INK_SOFT, marginBottom: 12 }}>
            처음이면 새 탐험 카드가 만들어지고, 다시 오면 <b style={{ color: "#0277BD" }}>풀던 곳부터 이어서</b> 할 수 있어요!
          </Bubble>
        </div>
        <img src={IMG.guide} alt="" aria-hidden className="floaty" style={{ width: 120, flexShrink: 0, position: "relative", zIndex: 1 }} />
      </div>

      <Card style={{ paddingTop: 22 }}>
        <label style={{ fontSize: 15, fontWeight: 800 }}>🙋 내 이름</label>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="예) 김제주" style={{ ...inputStyle, marginBottom: 16 }} />
        <label style={{ fontSize: 15, fontWeight: 800 }}>🔑 나만의 비밀번호 (숫자 6자리)</label>
        <input
          value={pw} inputMode="numeric" maxLength={6}
          onChange={(e) => setPw(e.target.value.replace(/\D/g, "").slice(0, 6))}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="예) 031919"
          style={{ ...inputStyle, marginBottom: 8, fontSize: 22, letterSpacing: 8, textAlign: "center" }}
        />
        <div style={{ fontSize: 13, color: "#8A96AB", marginBottom: 16, lineHeight: 1.6 }}>💡 잊어버리지 않게 기억해 두세요! 나중에 같은 이름과 비밀번호로 들어오면 이어서 할 수 있어요.<br />🧑‍🏫 인솔 선생님은 이름에 <b>교사</b>, 비밀번호에 안내받은 번호를 넣어 주세요.</div>
        {msg && <div className="shake" style={{ color: "#E53935", fontSize: 15, marginBottom: 10, fontWeight: 700 }}>⚠️ {msg}</div>}
        <BigButton onClick={submit} disabled={busy} color="#1E9BE0">{busy ? "확인 중..." : "출발! 🏁"}</BigButton>
      </Card>
    </div>
  );
}

/* ── 코스 선택: 탐험 지도 ── */
function courseState(user, c) {
  const arr = user.courses[c]?.solved || [];
  const solved = arr.filter(Boolean).length;
  return { arr, solved, status: solved >= NUM_Q ? "done" : solved > 0 ? "going" : "ready" };
}

// 카드 사이를 잇는 점선 + 발자국
function PathLink({ fromLeft, color = "#E0C9A0" }) {
  // 카드가 왼쪽/오른쪽으로 번갈아 놓이므로 곡선도 번갈아 휘어요
  const d = fromLeft ? "M 30 0 C 30 30, 70 14, 70 46" : "M 70 0 C 70 30, 30 14, 30 46";
  return (
    <div aria-hidden style={{ position: "relative", height: 46, margin: "-4px 0" }}>
      <svg viewBox="0 0 100 46" preserveAspectRatio="none" style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}>
        <path d={d} fill="none" stroke={color} strokeWidth="3.5" strokeDasharray="2 9" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      </svg>
      <span style={{ position: "absolute", left: "50%", top: "50%", transform: `translate(-50%,-50%) rotate(${fromLeft ? -35 : 35}deg)`, fontSize: 18, opacity: .55 }}>👣</span>
    </div>
  );
}

        </div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 6, marginTop: 6 }}>

      </div>

      {/* 무궁화 도장판 */}
      <Card style={{ marginBottom: 22, background: "linear-gradient(140deg,#FFFBEA,#FFEFD0)", padding: "16px 16px 14px" }}>
        <Sticker name="map" size={50} style={{ top: 10, right: 10, transform: "rotate(8deg)" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, paddingRight: 54 }}>
          <img src={IMG.hibiscus} alt="" aria-hidden style={{ width: 54, flexShrink: 0, transform: "rotate(-10deg)" }} />
          <div>
            <div className="title-font" style={{ fontSize: 18, color: INK }}>내 무궁화 도장</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#B4530F" }}>
              <span className="title-font" style={{ fontSize: 22, color: "#D6336C" }}>{totalSolved}</span>개 모았어요! <span style={{ color: "#A89270", fontWeight: 600, fontSize: 13 }}>목표 {TOTAL}개</span>
            </div>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(10,1fr)", gap: 4, justifyItems: "center", background: "rgba(255,255,255,.7)", borderRadius: 16, padding: "10px 8px", marginTop: 12, border: "2px dashed #F2D6A6" }}>
          {sorted.map((f, i) => <Mugunghwa key={i} size={24} filled={f} current={i === totalSolved} />)}
        </div>
        <div style={{ fontSize: 13, color: "#9A7B4F", marginTop: 8, textAlign: "center", fontWeight: 600 }}>
          {totalSolved === 0 ? "탐험을 시작하면 도장이 하나씩 채워져요!" : `완주한 코스 ${doneCourses}개 · 남은 도장 ${TOTAL - totalSolved}개`}
        </div>
      </Card>

      {/* 탐험 지도 */}
      <div style={{ textAlign: "center", marginBottom: 6 }}>
        <div className="title-font" style={{ fontSize: 24, color: INK }}>🧭 어느 길로 탐험할까요?</div>
        <div style={{ fontSize: 14, color: INK_SOFT, marginTop: 2, fontWeight: 600 }}>지도 속 코스를 눌러 출발해요!</div>
      </div>

      <div style={{ position: "relative", padding: "6px 0" }}>
        {/* 출발 지점 */}
        <div style={{ display: "flex", justifyContent: "flex-start", paddingLeft: 6 }}>
          <span className="title-font" style={{ background: "#fff", color: "#2E7D32", borderRadius: 999, padding: "7px 14px", fontSize: 15, boxShadow: "0 3px 0 rgba(0,0,0,.08)", border: "3px solid #C8E6C9" }}>🚩 출발 지점</span>
        </div>
        <PathLink fromLeft />
        {COURSES.map((c, i) => (
          <React.Fragment key={c}>
            <CourseCard c={c} user={user} icons={icons} onPick={onPick} side={i % 2 === 0 ? "right" : "left"} />
            <PathLink fromLeft={i % 2 === 1} />
          </React.Fragment>
        ))}
        {/* 도착 지점 */}
        <div style={{ display: "flex", justifyContent: "center" }}>
          <div style={{ textAlign: "center", background: allDone ? "linear-gradient(135deg,#FFE082,#FFCA28)" : "#fff", borderRadius: 22, padding: "10px 20px", boxShadow: "0 4px 0 rgba(0,0,0,.08)", border: "3px solid #FFE7A3" }}>
            <div className="title-font" style={{ fontSize: 17, color: allDone ? "#7A3E00" : INK }}>🏁 탐험 완료 지점</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: allDone ? "#7A3E00" : INK_SOFT }}>{allDone ? "모든 코스 완주! 탐험대 인증 완료 🎖️" : `5개 코스 중 ${doneCourses}개 완주`}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 축하 꽃가루 ── */
function Confetti() {
  const pieces = Array.from({ length: 26 });
  const colors = ["#FF8A3D", "#29A3E0", "#4CAF50", "#EC5D92", "#7E57C2", "#FFD54F"];
  return (
    <div aria-hidden className="confetti" style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 50 }}>
      {pieces.map((_, i) => (
        <span key={i} style={{ position: "absolute", left: `${(i * 37) % 100}%`, top: 0, width: 9, height: 14, borderRadius: 3, background: colors[i % colors.length], animation: `confetti ${2.6 + (i % 5) * 0.4}s linear ${(i % 7) * 0.25}s 2 both` }} />
      ))}
    </div>
  );
}

/* ── 교사용 정답 상자 ── */
function TeacherAnswer({ answer }) {
  const { main, alts } = answerParts(answer);
  return (
    <div style={{ marginTop: 12, background: "#FFF8D6", border: "3px dashed #F2B705", borderRadius: 18, padding: "10px 14px" }}>
      <div style={{ fontSize: 13, fontWeight: 800, color: "#8A6100" }}>🔑 선생님용 정답</div>
      <div className="title-font" style={{ fontSize: 24, color: "#C2185B", marginTop: 2 }}>{main || "등록된 정답 없음"}</div>
      {alts.length > 0 && <div style={{ fontSize: 13, color: "#7A6A4F", fontWeight: 600 }}>이렇게 써도 정답: {alts.join(" · ")}</div>}
    </div>
  );
}

/* ── 훈장 (건국훈장을 바탕으로 그린 일러스트) ── */
function Medal({ size = 40, style, className }) {
  const line = "#8A5C3A";
  const rays = Array.from({ length: 16 }, (_, i) => i * 22.5);
  return (
    <svg viewBox="-50 -50 100 100" width={size} height={size} className={className} style={style} aria-hidden>
      {/* 금빛 햇살 */}
      {rays.map((r) => (
        <path key={r} d="M0 -46 L5 -14 L-5 -14 Z" transform={`rotate(${r})`} fill={r % 45 === 0 ? "#F6C945" : "#FBDD7A"} stroke={line} strokeWidth="1.6" strokeLinejoin="round" />
      ))}
      {/* 파란 뾰족 장식 (대각선 4곳) */}
      {[45, 135, 225, 315].map((r) => (
        <path key={r} d="M0 -44 L9 -26 L0 -20 L-9 -26 Z" transform={`rotate(${r})`} fill="#4F63D9" stroke={line} strokeWidth="1.6" strokeLinejoin="round" />
      ))}
      {/* 금 테두리 + 보라 구슬 */}
      <circle r="21" fill="#F6C945" stroke={line} strokeWidth="1.8" />
      {Array.from({ length: 12 }, (_, i) => i * 30).map((r) => (
        <circle key={r} cx="0" cy="-17" r="2.3" fill="#8E5BC7" transform={`rotate(${r})`} />
      ))}
      {/* 가운데 태극 */}
      <circle r="12.5" fill="#FFF8E6" stroke={line} strokeWidth="1.4" />
      {/* 빨강 위 · 파랑 아래, 가운데는 완만한 물결선 */}
      <circle r="10" fill="#0047A0" />
      <path d="M-10 0 A10 10 0 0 1 10 0 C 4 -4.5, -4 4.5, -10 0 Z" fill="#CD2E3A" />
    </svg>
  );
}

/* ── 가슴에 달리는 훈장 (위에서 빙글 돌며 내려와 착 붙어요) ── */
function PinnedMedal({ x, y, size, delay }) {
  return (
    <div aria-hidden style={{ position: "absolute", left: x, top: y, width: size, aspectRatio: "1", transform: "translate(-50%,-50%)", zIndex: 2 }}>
      {/* 반짝 터지는 빛 */}
      <svg viewBox="-50 -50 100 100" className="medal-burst" style={{ position: "absolute", inset: "-60%", width: "220%", height: "220%", animationDelay: `${delay + 0.55}s` }}>
        {Array.from({ length: 10 }, (_, i) => i * 36).map((r) => (
          <path key={r} d="M0 -46 L3 -30 L0 -26 L-3 -30 Z" transform={`rotate(${r})`} fill="#FFD54F" />
        ))}
        <circle r="30" fill="none" stroke="#FFE082" strokeWidth="3" />
      </svg>
      <div className="medal-pin" style={{ width: "100%", height: "100%", animationDelay: `${delay}s, ${delay + 1.2}s` }}>
        <Medal size="100%" />
      </div>
    </div>
  );
}

/* ── 퀴즈 진행 ── */
function Quiz({ user, setUser, icons, course, onExit }) {
  const col = COURSE_COLORS[course];
  const th = COURSE_THEME[course];
  const prog = user.courses[course] || { solved: Array(NUM_Q).fill(false), attempts: Array(NUM_Q).fill(0) };
  const firstUnsolved = prog.solved.findIndex((s) => !s);
  const [idx, setIdx] = useState(firstUnsolved === -1 ? 0 : firstUnsolved);
  const [q, setQ] = useState(null);
  const [loading, setLoading] = useState(true);
  const [input, setInput] = useState("");
  const [state, setState] = useState("answering"); // answering | correct | wrong | noanswer
  const [wrongCount, setWrongCount] = useState(0);
  const [review, setReview] = useState(false); // 완주한 코스를 다시 보기
  const inputRef = useRef(null);

  const allDone = prog.solved.every(Boolean) && prog.solved.length >= NUM_Q;

  useEffect(() => {
    let alive = true;
    setLoading(true);
    setState(prog.solved[idx] ? "correct" : "answering");
    setInput("");
    setWrongCount(0);
    loadQuestion(course, idx + 1).then((data) => { if (alive) { setQ(data); setLoading(false); } });
    return () => { alive = false; };
  }, [course, idx]);

  const saveProgress = async (newProg) => {
    const updated = { ...user, courses: { ...user.courses, [course]: newProg } };
    setUser(updated);
    await sSet(user.key, { name: user.name, pw: user.pw, courses: updated.courses, createdAt: user.createdAt || "", updatedAt: new Date().toISOString() });
  };

  const submit = async () => {
    if (!q) return;
    if (!q.answer) { setState("noanswer"); return; }
    const solvedArr = [...(prog.solved || Array(NUM_Q).fill(false))];
    const attemptsArr = [...(prog.attempts || Array(NUM_Q).fill(0))];
    attemptsArr[idx] = (attemptsArr[idx] || 0) + 1;
    if (checkAnswer(input, q.answer)) {
      playFanfare();
      solvedArr[idx] = true;
      setState("correct");
      setReview(false);
      await saveProgress({ solved: solvedArr, attempts: attemptsArr });
    } else {
      playBuzzer();
      setWrongCount((w) => w + 1);
      setState("wrong");
      await saveProgress({ solved: solvedArr, attempts: attemptsArr });
      setTimeout(() => inputRef.current && inputRef.current.focus(), 100);
    }
  };

  const goNext = () => {
    if (review) { if (idx < NUM_Q - 1) setIdx(idx + 1); else setReview(false); return; }
    const next = prog.solved.findIndex((s, i) => !s && i !== idx);
    if (next === -1 && prog.solved.filter(Boolean).length >= NUM_Q) return;
    if (idx < NUM_Q - 1 && !prog.solved[idx + 1]) setIdx(idx + 1);
    else if (next !== -1) setIdx(next);
    else if (idx < NUM_Q - 1) setIdx(idx + 1);
  };

  /* 완주 화면 */
  if (allDone && !review) {
    return (
      <div style={{ textAlign: "center", paddingTop: 10, position: "relative" }}>
        <Confetti />
        <div style={{ position: "relative", width: "min(300px,80vw)", margin: "0 auto" }}>
          <div style={{ position: "absolute", inset: "4% -4% 0", borderRadius: "50%", background: "radial-gradient(circle,#FFF6D5 0%,#FFE3A0 70%)", border: "4px solid #fff" }} />
          <div style={{ position: "relative" }}>
            <img src={IMG.celebrate} alt="두 손을 번쩍 들고 기뻐하는 탐험대원 두 명, 가슴에 건국훈장이 달려요" style={{ width: "100%", display: "block", position: "relative" }} />
            {/* 두 아이 가슴에 달리는 건국훈장 */}
            <PinnedMedal x="38.1%" y="48%" size="15.5%" delay={0.5} />
            <PinnedMedal x="73.5%" y="46.2%" size="15.5%" delay={1.15} />
          </div>
          <span className="stampIn title-font" style={{ position: "absolute", bottom: 6, right: -14, background: "#D6336C", color: "#fff", border: "4px solid #fff", borderRadius: "50%", width: 86, height: 86, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, lineHeight: 1.15, boxShadow: "0 4px 0 rgba(0,0,0,.15)" }}>완주<br />성공!</span>
        </div>
        <h2 className="title-font" style={{ fontSize: 32, margin: "16px 0 6px", color: col.deep }}>{course} 코스 완주! 🎉</h2>
        <p style={{ fontSize: 17, color: INK_SOFT, lineHeight: 1.6, margin: 0, fontWeight: 500 }}>{user.name} 탐험대원, 정말 멋져요!<br />무궁화 도장 {NUM_Q}개를 모두 모았어요</p>
        <Card style={{ margin: "18px 0", display: "flex", justifyContent: "center", gap: 6, background: "linear-gradient(140deg,#FFFBEA,#FFEFD0)" }}>
          {Array.from({ length: NUM_Q }).map((_, i) => (
            <span key={i} className="pop" style={{ animationDelay: `${i * 0.12}s` }}><Mugunghwa filled size={38} /></span>
          ))}
        </Card>
        <BigButton onClick={onExit} color={col.deep}>다른 코스 탐험하기 🗺️</BigButton>
        <button onClick={() => { setReview(true); setIdx(0); }} style={{ marginTop: 12, background: "none", border: "none", color: INK_SOFT, fontSize: 15, fontWeight: 700, textDecoration: "underline" }}>
          이 코스 문제 다시 보기
        </button>
        <div style={{ marginTop: 18, fontSize: 13, color: "#9AA6BB" }}>이 체험은 조천초등학교 4학년 학생들이 만들었어요 🏫</div>
      </div>
    );
  }

  const solvedCount = prog.solved.filter(Boolean).length;
  const isLastToSolve = solvedCount >= NUM_Q;

  return (
    <div>
      {/* 헤더 */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <button onClick={onExit} className="press" style={{ background: "#fff", border: "none", borderRadius: 999, padding: "10px 14px", fontSize: 14, color: INK_SOFT, fontWeight: 700, boxShadow: "0 3px 0 rgba(36,64,107,.08)" }}>← 탐험 지도</button>
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", color: col.deep, borderRadius: 999, padding: "5px 16px 5px 6px", boxShadow: `0 3px 0 ${col.deep}33`, border: `3px solid ${col.bg}` }}>
          <CourseIcon course={course} icons={icons} size={32} />
          <span className="title-font" style={{ fontSize: 17 }}>{course} 코스</span>
        </div>
      </div>

      {/* 코스 경로 + 문제 진행 */}
      <Card style={{ marginBottom: 14, padding: "12px 12px 14px", background: `linear-gradient(160deg,#fff,${col.bg})` }}>
        <div style={{ textAlign: "center", fontSize: 13, color: "#2B3A55", fontWeight: 600, marginBottom: 10 }}>
          🚶 <b style={{ color: col.deep }}>{COURSE_ROUTES[course]}</b>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
          {Array.from({ length: NUM_Q }).map((_, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span aria-hidden style={{ width: 12, borderTop: `3px dotted ${prog.solved[i - 1] ? col.deep : "#D5DEEA"}` }} />}
              <button onClick={() => setIdx(i)} aria-label={`${i + 1}번 문제${prog.solved[i] ? " (해결)" : ""}`}
                style={{
                  width: 42, height: 42, borderRadius: "50%", flexShrink: 0, padding: 0,
                  border: i === idx ? `3px solid ${col.deep}` : "3px solid #fff",
                  background: prog.solved[i] ? "#FFF0F5" : "#fff", fontSize: 17,
                  color: i === idx ? col.deep : "#9AA6BB", boxShadow: i === idx ? `0 0 0 4px ${col.deep}22` : "0 2px 0 rgba(0,0,0,0.08)",
                  display: "flex", alignItems: "center", justifyContent: "center", fontFamily: TITLE_FONT,
                }}>
                {prog.solved[i] ? <Mugunghwa filled size={28} /> : i + 1}
              </button>
            </React.Fragment>
          ))}
        </div>
      </Card>

      {loading || !q ? (
        <Card style={{ textAlign: "center", padding: 40 }}>
          <div className="bob" style={{ fontSize: 40 }}>🔎</div>
          <div style={{ marginTop: 6, fontWeight: 700, color: INK_SOFT }}>단서를 찾는 중...</div>
        </Card>
      ) : (
        <div style={{ display: "grid", gap: 14 }}>
          {/* 장소 */}
          {q.loc && (
            <div style={{ textAlign: "center" }}>
              <span className="title-font" style={{ display: "inline-block", background: INK, color: "#fff", borderRadius: 999, padding: "9px 22px", fontSize: 17, boxShadow: "0 4px 0 rgba(0,0,0,.15)", border: "3px solid #fff" }}>
                📍 {q.loc}
              </span>
            </div>
          )}

          {/* 길잡이 암호 */}
          <Card className="drop" style={{ background: "linear-gradient(170deg,#fff 60%,#E3F4FD)", borderColor: "#BFE6FA" }}>
            <Sticker name="compass" size={44} style={{ top: 8, right: 10, opacity: .9, transform: "rotate(10deg)" }} />
            <TagLabel icon="🧭" text="길잡이 암호" color="#1E9BE0" />
            {q.guideText && <div style={{ fontSize: 17, lineHeight: 1.7, whiteSpace: "pre-wrap", fontWeight: 500 }}>{q.guideText}</div>}
            {q.guideImg && <img src={q.guideImg} alt="길잡이 암호 이미지" style={{ display: "block", width: "100%", maxWidth: 380, height: "auto", margin: "10px auto 0", borderRadius: 16, border: "3px solid #fff", background: "#fff" }} />}
            {!q.guideText && !q.guideImg && <div style={{ color: "#9AA6BB" }}>등록된 암호가 없어요</div>}
          </Card>

          {/* 위치 암호 */}
          <Card className="drop" style={{ background: "linear-gradient(170deg,#fff 60%,#E5F6E6)", borderColor: "#C8E6C9", animationDelay: ".08s" }}>
            <Sticker name="map" size={50} style={{ top: 8, right: 8, opacity: .9, transform: "rotate(-8deg)" }} />
            <TagLabel icon="🔍" text="위치 암호" color="#43A047" />
            {q.posText && <div style={{ fontSize: 17, lineHeight: 1.7, whiteSpace: "pre-wrap", fontWeight: 500 }}>{q.posText}</div>}
            {q.posImg && <img src={q.posImg} alt="위치 암호 이미지" style={{ display: "block", width: "100%", maxWidth: 380, height: "auto", margin: "10px auto 0", borderRadius: 16, border: "3px solid #fff", background: "#fff" }} />}
          </Card>

          {/* 문제 (학생 배경 이미지) */}
          <Card className="drop" style={{ borderColor: "#FFD9B0", animationDelay: ".16s", background: "#FFFDF8" }}>
            {q.bgImg && (
              <div aria-hidden style={{ position: "absolute", inset: 0, backgroundImage: `url(${q.bgImg})`, backgroundSize: "cover", backgroundPosition: "center", opacity: 0.16, pointerEvents: "none" }} />
            )}
            <div style={{ position: "relative" }}>
              <TagLabel icon="✏️" text={`문제 ${idx + 1}`} color="#FF7A2F" />
              <div style={{ fontSize: 18, lineHeight: 1.85, whiteSpace: "pre-wrap", fontWeight: 700 }}>{q.qText || "문제가 아직 등록되지 않았어요."}</div>
              {user.teacher && <TeacherAnswer answer={q.answer} />}
              {q.qImg && <img src={q.qImg} alt="문제 이미지" style={{ display: "block", width: "100%", maxWidth: 380, height: "auto", margin: "10px auto 0", borderRadius: 16, border: "3px solid #fff", background: "#fff" }} />}

              {state !== "correct" ? (
                <div style={{ marginTop: 16 }}>
                  <input
                    ref={inputRef}
                    value={input}
                    onChange={(e) => { setInput(e.target.value); if (state === "wrong") setState("answering"); }}
                    onKeyDown={(e) => e.key === "Enter" && submit()}
                    placeholder="□□에 들어갈 답을 적어요"
                    className={state === "wrong" ? "shake" : ""}
                    style={{ width: "100%", boxSizing: "border-box", padding: "15px 16px", fontSize: 19, fontWeight: 700, borderRadius: 18, border: state === "wrong" ? "3px solid #E53935" : "3px solid #FFD39A", marginBottom: 10, background: "rgba(255,255,255,0.95)" }}
                  />
                  {state === "wrong" && (
                    <div className="pop" style={{ display: "flex", alignItems: "flex-end", gap: 8, marginBottom: 10 }}>
                      <img src={IMG.helper} alt="" aria-hidden style={{ width: 92, flexShrink: 0 }} />
                      <Bubble color="#FFEFF1" tail="left" style={{ flex: 1, color: "#C62828", marginBottom: 14 }}>
                        🙈 아쉬워요! 다시 한번 생각해 봐요.
                        {wrongCount >= 3 && <div style={{ marginTop: 4, color: "#8A4B00" }}>💡 힌트: 위치 암호가 알려주는 곳을 다시 잘 살펴보세요!</div>}
                      </Bubble>
                    </div>
                  )}
                  {state === "noanswer" && (
                    <div style={{ background: "#FFF3CD", borderRadius: 14, padding: "10px 14px", fontSize: 15, marginBottom: 10 }}>
                      이 문제는 아직 정답이 등록되지 않았어요. 선생님께 알려 주세요!
                    </div>
                  )}
                  <BigButton onClick={submit} color="#FF7A2F">정답 확인! ✅</BigButton>
                </div>
              ) : (
                <div className="pop" style={{ marginTop: 18, textAlign: "center" }}>
                  <div className="stampIn" style={{ display: "inline-block" }}><Mugunghwa filled size={74} /></div>
                  <div className="title-font" style={{ fontSize: 24, color: "#2E7D32", margin: "6px 0 14px" }}>정답이에요! 도장 획득! 🎉</div>
                  <BigButton onClick={goNext} color={col.deep}>
                    {review ? (idx < NUM_Q - 1 ? "다음 문제 보기 →" : "완주 화면으로 🏆") : isLastToSolve ? "완주 확인 🏆" : "다음 장소로 이동해요 →"}
                  </BigButton>
                </div>
              )}
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ── 관리자: 방문 기록 (CSV 내려받기) ── */
function downloadCSV(filename, rows) {
  const esc = (v) => { const t = String(v ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "\uFEFF" + rows.map((r) => r.map(esc).join(",")).join("\r\n"); // 엑셀에서 한글이 깨지지 않도록 BOM
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };

function VisitorData() {
  const [msg, setMsg] = useState("");
  const [summary, setSummary] = useState(null);
  const today = () => new Date().toISOString().slice(0, 10);

  const fetchVisitors = async () => {
    const all = await listVisitors();
    return all.filter((v) => v.name !== TEACHER_NAME); // 교사 계정은 통계에서 빼요
  };
  const qStat = (v, c, i) => {
    const cp = (v.courses || {})[c] || {};
    return { solved: !!(cp.solved || [])[i], tries: (cp.attempts || [])[i] || 0 };
  };

  const loadSummary = async () => {
    setMsg("⏳ 방문 기록을 불러오는 중...");
    try {
      const vs = await fetchVisitors();
      const stamps = vs.reduce((a, v) => a + COURSES.reduce((b, c) => b + ((v.courses?.[c]?.solved || []).filter(Boolean).length), 0), 0);
      const finishers = vs.filter((v) => COURSES.some((c) => (v.courses?.[c]?.solved || []).filter(Boolean).length >= NUM_Q)).length;
      setSummary({ count: vs.length, stamps, finishers });
      setMsg("");
    } catch (e) { console.error(e); setMsg("❌ 불러오지 못했어요. 인터넷 연결과 Firebase 보안 규칙을 확인해 주세요."); }
  };

  const exportVisitors = async () => {
    setMsg("⏳ 방문자별 기록을 만드는 중...");
    try {
      const vs = await fetchVisitors();
      const qCols = COURSES.flatMap((c) => Array.from({ length: NUM_Q }, (_, i) => `${c}-${i + 1}`));
      const head = ["이름", "처음 기록", "마지막 기록", "모은 도장(30개 중)", "완주한 코스 수", ...COURSES.map((c) => `${c}코스 해결 수`), ...qCols];
      const rows = vs.map((v) => {
        const perCourse = COURSES.map((c) => (v.courses?.[c]?.solved || []).filter(Boolean).length);
        const cells = COURSES.flatMap((c) => Array.from({ length: NUM_Q }, (_, i) => {
          const { solved, tries } = qStat(v, c, i);
          return tries === 0 && !solved ? "" : `${solved ? "정답" : "미해결"}(시도 ${tries})`;
        }));
        return [v.name, fmtTime(v.createdAt), fmtTime(v.updatedAt), perCourse.reduce((a, b) => a + b, 0), perCourse.filter((n) => n >= NUM_Q).length, ...perCourse, ...cells];
      });
      downloadCSV(`암호탐험대_방문자별기록_${today()}.csv`, [head, ...rows]);
      setMsg(`✅ 방문자 ${vs.length}명의 기록을 내려받았어요.`);
    } catch (e) { console.error(e); setMsg("❌ 내려받지 못했어요. 인터넷 연결과 Firebase 보안 규칙을 확인해 주세요."); }
  };

  const exportQuestions = async () => {
    setMsg("⏳ 문제별 통계를 만드는 중...");
    try {
      const vs = await fetchVisitors();
      const head = ["코스", "번호", "장소", "정답", "도전한 사람", "맞힌 사람", "정답률(%)", "맞힌 사람의 평균 시도 횟수", "전체 오답 수"];
      const rows = [];
      for (const c of COURSES) {
        for (let i = 0; i < NUM_Q; i++) {
          const q = await loadQuestion(c, i + 1);
          let tried = 0, solved = 0, triesOfSolvers = 0, wrong = 0;
          vs.forEach((v) => {
            const s = qStat(v, c, i);
            if (s.tries > 0 || s.solved) tried++;
            if (s.solved) { solved++; triesOfSolvers += s.tries; }
            wrong += Math.max(0, s.tries - (s.solved ? 1 : 0));
          });
          rows.push([c, i + 1, q.loc, answerParts(q.answer).main, tried, solved, tried ? Math.round((solved / tried) * 100) : "", solved ? (triesOfSolvers / solved).toFixed(1) : "", wrong]);
        }
      }
      downloadCSV(`암호탐험대_문제별통계_${today()}.csv`, [head, ...rows]);
      setMsg(`✅ 문제 30개의 통계를 내려받았어요. (방문자 ${vs.length}명 기준)`);
    } catch (e) { console.error(e); setMsg("❌ 내려받지 못했어요. 인터넷 연결과 Firebase 보안 규칙을 확인해 주세요."); }
  };

  const btn = { flex: 1, background: "#2E7D32", color: "#fff", border: "none", borderRadius: 14, padding: "12px 0", fontSize: 14.5, fontWeight: 700, boxShadow: "0 3px 0 rgba(0,0,0,0.12)" };
  return (
    <Card style={{ marginBottom: 14, background: "linear-gradient(135deg,#EFFAEF,#E6F4E7)" }}>
      <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 4 }}>📊 방문 기록 내려받기</div>
      <div style={{ fontSize: 13, color: "#5A6B85", marginBottom: 12, lineHeight: 1.7 }}>
        방문자들이 문제를 푼 기록을 <b>엑셀에서 열 수 있는 파일(CSV)</b>로 내려받아요. 교사 계정은 빠져요.
      </div>
      <button onClick={loadSummary} style={{ ...btn, width: "100%", background: "#fff", color: "#2E7D32", border: "2px solid #2E7D32", marginBottom: 8 }}>🔎 지금까지 기록 요약 보기</button>
      {summary && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6, marginBottom: 10, textAlign: "center" }}>
          {[["방문자", summary.count + "명"], ["모인 도장", summary.stamps + "개"], ["코스 완주자", summary.finishers + "명"]].map(([k, v]) => (
            <div key={k} style={{ background: "#fff", borderRadius: 12, padding: "8px 4px" }}>
              <div style={{ fontSize: 12, color: "#5A6B85" }}>{k}</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: "#2E7D32" }}>{v}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={exportVisitors} style={btn}>⬇️ 방문자별 기록</button>
        <button onClick={exportQuestions} style={btn}>⬇️ 문제별 통계</button>
      </div>
      {msg && <div style={{ marginTop: 10, fontSize: 13.5, fontWeight: 700, lineHeight: 1.6 }}>{msg}</div>}
      <div style={{ fontSize: 12, color: "#8A96AB", marginTop: 10, lineHeight: 1.6 }}>
        💡 저장되는 것: 이름, 문제별 정답 여부와 시도 횟수, 처음·마지막 기록 시각. 방문자가 입력한 답의 내용은 저장되지 않아요.
      </div>
    </Card>
  );
}

function Admin({ icons, onIconsChanged, onExit }) {
  const [course, setCourse] = useState("A");

  const [loading, setLoading] = useState(true);
  const [saveMsg, setSaveMsg] = useState("");
  const [iconMsg, setIconMsg] = useState("");

  const uploadCourseIcon = async (c, file) => {
    if (!file) return;
    setIconMsg(`${c} 코스 아이콘 저장 중...`);
    try {
      const url = await compressImage(file, 240, 0.8);
      const current = (await sGet("course-icons")) || {};
      const ok = await sSet("course-icons", { ...current, [c]: url });
      setIconMsg(ok ? `✅ ${c} 코스 아이콘 저장 완료!` : "❌ 저장 실패");
      if (ok && onIconsChanged) onIconsChanged();
    } catch {
      setIconMsg("❌ 이미지를 불러오지 못했어요");
    }
  };

  const removeCourseIcon = async (c) => {
    const current = (await sGet("course-icons")) || {};
    delete current[c];
    await sSet("course-icons", current);
    setIconMsg(`${c} 코스 아이콘을 삭제했어요 (기본 글자 배지로 표시)`);
    if (onIconsChanged) onIconsChanged();
  };

  /* ── 데이터 내보내기 / 가져오기 (백업 · 이관용) ── */
  const [backupMsg, setBackupMsg] = useState("");

  const exportAll = async () => {
    setBackupMsg("⏳ 모든 문제와 이미지를 모으는 중... 잠시만요");
    try {
      const questions = {};
      for (const c of COURSES) {
        for (let i = 1; i <= NUM_Q; i++) {
          questions[`${c}-${i}`] = await loadQuestion(c, i);
        }
      }
      const iconsData = (await sGet("course-icons")) || {};
      const payload = {
        app: "jeju-hangil-quiz",
        version: 1,
        exportedAt: new Date().toISOString(),
        questions,
        courseIcons: iconsData,
      };
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `암호탐험_전체백업_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setBackupMsg("✅ 백업 파일을 내려받았어요! 이 파일 하나에 30개 문제의 텍스트·정답·이미지·코스 아이콘이 전부 들어 있어요. 안전한 곳에 보관하세요.");
    } catch {
      setBackupMsg("❌ 내보내기에 실패했어요. 다시 시도해 주세요.");
    }
  };

  const importAll = async (file) => {
    if (!file) return;
    setBackupMsg("⏳ 백업 파일을 읽는 중...");
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.app !== "jeju-hangil-quiz" || !data.questions) throw new Error("format");
      const entries = Object.entries(data.questions);
      let count = 0;
      for (const [key, qd] of entries) {
        const [c, n] = key.split("-");
        if (!COURSES.includes(c)) continue;
        count += 1;
        setBackupMsg(`⏳ 가져오는 중... (${count}/${entries.length})`);
        await sSet(`q-${c}-${n}`, qd);
      }
      if (data.courseIcons) {
        await sSet("course-icons", data.courseIcons);
        if (onIconsChanged) onIconsChanged();
      }
      const d = await loadQuestion(course, num);
      setQ(d);
      setBackupMsg(`✅ 가져오기 완료! 문제 ${count}개와 코스 아이콘을 모두 불러왔어요.`);
    } catch {
      setBackupMsg("❌ 파일을 읽지 못했어요. 이 앱에서 내보낸 백업 파일(.json)이 맞는지 확인해 주세요.");
    }
  };

  useEffect(() => {
    let alive = true;
    setLoading(true);
    setSaveMsg("");
    loadQuestion(course, num).then((d) => { if (alive) { setQ(d); setLoading(false); } });
    return () => { alive = false; };
  }, [course, num]);

  const set = (field, val) => setQ((prev) => ({ ...prev, [field]: val }));

  const uploadImg = async (field, file) => {
    if (!file) return;
    try {
      const url = await compressImage(file);
      set(field, url);
    } catch {
      alert("이미지를 불러오지 못했어요. 다른 파일로 시도해 주세요.");
    }
  };

  const save = async () => {
    setSaveMsg("저장 중...");
    const ok = await sSet(`q-${course}-${num}`, q);
    setSaveMsg(ok ? "✅ 저장 완료!" : "❌ 저장 실패 — 이미지 용량을 줄여 보세요");
  };

  const renderImgField = (label, field) => (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{label}</div>
      {q[field] ? (
        <div>
          <img src={q[field]} alt={label} style={{ width: "100%", maxHeight: 180, objectFit: "contain", borderRadius: 12, background: "#F2F5FA", border: "2px solid #DCE4F0" }} />
          <button onClick={() => set(field, "")} style={{ marginTop: 6, background: "#FFEBEE", color: "#C62828", border: "none", borderRadius: 10, padding: "6px 14px", fontSize: 13 }}>🗑 이미지 삭제</button>
        </div>
      ) : (
        <label style={{ display: "block", border: "2px dashed #B9C4D6", borderRadius: 12, padding: "18px 12px", textAlign: "center", color: "#7A879C", fontSize: 14, cursor: "pointer", background: "#FAFCFF" }}>
          📷 눌러서 이미지 선택 (자동으로 크기를 줄여 저장해요)
          <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => uploadImg(field, e.target.files[0])} />
        </label>

    </div>

  const renderTextField = (label, field, rows = 2, placeholder = "") => (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{label}</div>

        <h2 style={{ fontSize: 24, margin: 0 }}>⚙️ 문제 관리</h2>
        <button onClick={onExit} style={{ background: "#fff", border: "2px solid #DCE4F0", borderRadius: 999, padding: "8px 16px", fontSize: 14, color: "#5A6B85" }}>나가기</button>

      {/* 데이터 백업 / 이관 */}
      <Card style={{ marginBottom: 14, background: "linear-gradient(135deg,#EEF7FF,#E8F0FF)" }}>
        <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 4 }}>📦 데이터 백업 · 이관</div>

            </div>
          ))}
        </div>
        {iconMsg && <div style={{ textAlign: "center", marginTop: 10, fontSize: 13, fontWeight: 700 }}>{iconMsg}</div>}
      </Card>

      {/* 코스/문제 선택 */}
      <Card style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
          {COURSES.map((c) => (
            <button key={c} onClick={() => setCourse(c)}
              style={{ flex: 1, minWidth: 50, padding: "10px 0", borderRadius: 12, border: "none", fontWeight: 800, fontSize: 16, background: c === course ? COURSE_COLORS[c].deep : COURSE_COLORS[c].bg, color: c === course ? "#fff" : COURSE_COLORS[c].deep }}>
              {c}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {Array.from({ length: NUM_Q }).map((_, i) => (
            <button key={i} onClick={() => setNum(i + 1)}
              style={{ flex: 1, padding: "8px 0", borderRadius: 12, border: num === i + 1 ? "3px solid #2B3A55" : "2px solid #DCE4F0", background: "#fff", fontWeight: 800, fontSize: 15 }}>
              {i + 1}
            </button>
          ))}
        </div>
      </Card>

      {loading || !q ? (
        <Card style={{ textAlign: "center", padding: 30 }}>불러오는 중...</Card>
      ) : (
        <Card>
          <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 14 }}>{course} 코스 · {num}번 문제</div>

          {renderTextField("📍 장소 (예: 제1전시실)", "loc", 1)}
          {renderTextField("🧭 길잡이 암호 (텍스트)", "guideText", 2)}
          {renderImgField("🧭 길잡이 암호 이미지", "guideImg")}
          {renderTextField("🔍 위치 암호 (텍스트)", "posText", 2)}
          {renderImgField("🔍 위치 암호 이미지", "posImg")}
          {renderTextField("✏️ 문제 텍스트 (빈칸은 □로 표시)", "qText", 4)}
          {renderImgField("✏️ 문제 이미지", "qImg")}
          {renderImgField("🖼 배경 이미지 (학생 작품 — 문제 카드 뒤에 흐릿하게 보여요)", "bgImg")}

          {renderTextField("✅ 정답", "answer", 1, "예) 항일")}
          <div style={{ fontSize: 13, color: "#7A879C", background: "#F2F5FA", borderRadius: 12, padding: "10px 12px", marginTop: -8, marginBottom: 16, lineHeight: 1.7 }}>
            💡 <b>정답 쓰는 법</b><br />
            · 같은 답을 여러 가지로 쓸 수 있으면 <b>|</b> 로 구분: <code>3.1운동|삼일운동</code><br />
            · 띄어쓰기·마침표는 자동으로 무시돼요 (3.1운동 = 31운동)<br />
            · 교사용 정답 화면에는 <b>|</b> 앞의 첫 번째 답이 대표 정답으로 보여요
          </div>

          <BigButton onClick={save} color="#2E7D32">💾 이 문제 저장하기</BigButton>
          {saveMsg && <div style={{ textAlign: "center", marginTop: 10, fontWeight: 700 }}>{saveMsg}</div>}
        </Card>
      )}

      <div style={{ fontSize: 13, color: "#9AA6BB", marginTop: 16, lineHeight: 1.7, textAlign: "center" }}>
        A~E 코스 6문제의 기본 텍스트와 정답은 정답표를 바탕으로 미리 담겨 있어요.<br />
        이미지만 올리고 저장하면 바로 사용할 수 있어요!
      </div>
    </div>
  );
}

/* ── 렌더링 ── */
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
